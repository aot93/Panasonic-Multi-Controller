name: Release builds

# Builds the Windows and macOS SEA executables (scripts/package.mjs) on
# their real target OS — windows-latest / macos-latest — since SEA
# injection copies whichever node binary is currently running and can't be
# cross-built from Linux. Zips each release/<platform> folder and attaches
# it to the matching GitHub release, creating the release if it doesn't
# exist yet.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach release zips to (defaults to the pushed tag)'
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            release_dir: release/win
            asset_name: ProjectorControl-win.zip
          - os: macos-latest
            platform: mac
            release_dir: release/mac
            asset_name: ProjectorControl-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run package:${{ matrix.platform }}

      - name: Zip release folder (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.release_dir }}/* -DestinationPath ${{ matrix.asset_name }}

      - name: Zip release folder (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: cd ${{ matrix.release_dir }} && zip -r ../../${{ matrix.asset_name }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ steps.tag.outputs.tag }}" --title "${{ steps.tag.outputs.tag }}" --generate-notes
          gh release upload "${{ steps.tag.outputs.tag }}" "${{ matrix.asset_name }}" --clobber
